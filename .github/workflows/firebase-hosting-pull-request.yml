# Gerado e corrigido pelo Antigravity
# Fluxo: Lint → Build → Testes Cross-Browser → Preview Deploy (PR)

name: 🔍 Preview Deploy on PR

on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  lint-build-test:
    name: 🔍 Lint + Build + Testes
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: TypeScript — verificar tipos
        run: npx tsc --noEmit

      - name: ESLint — verificar código
        run: npm run lint

      - name: Build de produção (ES2015 + legado)
        run: npm run build

      - name: Instalar browsers do Playwright
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Rodar testes de compatibilidade
        run: npx playwright test

      - name: Upload relatório Playwright (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-pr-${{ github.event.pull_request.number }}
          path: playwright-report/
          retention-days: 7

  preview-deploy:
    name: 🔥 Firebase Preview Deploy
    needs: lint-build-test
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar e buildar
        run: npm ci && npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHAMADA_DIGITAL_9489E }}
          projectId: chamada-digital-9489e
