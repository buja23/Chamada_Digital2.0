# Gerado e corrigido pelo Antigravity
# Fluxo: Lint → Build → Testes Cross-Browser → Deploy Firebase

name: 🚀 Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────
  # 1. Lint + TypeScript + Build
  # ─────────────────────────────────────────
  lint-and-build:
    name: 🔍 Lint + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: TypeScript — verificar tipos
        run: npx tsc --noEmit

      - name: ESLint — verificar código
        run: npm run lint

      - name: Build de produção (ES2015 + legado)
        run: npm run build

      - name: Salvar artefato do build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ─────────────────────────────────────────
  # 2. Testes Cross-Browser com Playwright
  # ─────────────────────────────────────────
  compatibility-tests:
    name: 🌐 Testes Cross-Browser
    needs: lint-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Baixar build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Instalar browsers do Playwright (Chromium, Firefox, WebKit)
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Rodar testes de compatibilidade
        run: npx playwright test

      - name: Upload relatório Playwright (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ─────────────────────────────────────────
  # 3. Deploy — só roda se build + testes OK
  # ─────────────────────────────────────────
  deploy:
    name: 🔥 Deploy Firebase
    needs: [lint-and-build, compatibility-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar build aprovado
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHAMADA_DIGITAL_9489E }}
          channelId: live
          projectId: chamada-digital-9489e
