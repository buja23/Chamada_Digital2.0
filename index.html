<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Compatibilidade com IE/Edge legado -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link rel="icon" type="image/svg+xml" href="/public/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sistema de Chamada Digital - Controle de presença de alunos" />
    <title>Sistema de Gerenciamento de Alunos e Chamada</title>
    <!-- Spinner CSS puro: aparece enquanto o JS carrega, evita flash de tela branca -->
    <style>
      #root:empty::after {
        content: '';
        display: block;
        width: 44px;
        height: 44px;
        margin: 40vh auto 0;
        border: 4px solid #e5e7eb;
        border-top-color: #dc2626;
        border-radius: 50%;
        animation: cd-spin 0.8s linear infinite;
      }
      @keyframes cd-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
